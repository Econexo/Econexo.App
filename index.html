<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Econexo - Plataforma de Trazabilidad Ambiental</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo_econexo_new.png">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#326105">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Econexo">
  <link rel="apple-touch-icon" href="/icon-192x192.png">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            "primary": "#326105",
            "secondary": "#b4d351",
            "background-main": "#ffffff",
            "background-dark": "#020617",
            "background-alt": "#f8f9fa",
            "text-main": "#333333",
            "text-muted": "#6b7280",
          },
          fontFamily: {
            sans: ["Nunito", "Inter", "sans-serif"],
            display: ["Montserrat", "sans-serif"],
          },
          boxShadow: {
            "card": "0 4px 20px rgba(0, 0, 0, 0.05)"
          }
        }
      }
    }
  </script>
  <style>
    /* ── Marco fijo de app ───────────────────────────────────────────────
       En el celular la página entera se arrastraba y rebotaba al hacer
       scroll, como una web. Ahora el documento no se desplaza nunca: el que
       hace scroll es #root, que ocupa justo la pantalla visible, y sin rebote.
       Así la barra inferior y los encabezados `sticky` de cada pantalla
       quedan quietos y solo se mueve el contenido.

       El zoom de accesibilidad NO se bloquea (el meta viewport no lleva
       maximum-scale ni user-scalable) y el texto se dimensiona en rem para
       seguir el tamaño de letra que el usuario elige en su teléfono. */
    html {
      font-size: 100%;
      /* 100%, no none: evita que iOS agrande el texto al girar el teléfono
         sin impedir que el usuario lo agrande él. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background-color: #f0f4f0;
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    #root {
      position: fixed;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    html.dark body {
      background-color: #020617;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideInDown {
      from {
        transform: translateY(-10px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-in {
      animation: fadeIn 0.3s ease-out, slideInDown 0.3s ease-out;
    }
  </style>

</head>

<body class="bg-background-main text-text-main antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
